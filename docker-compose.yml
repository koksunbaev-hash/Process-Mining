# The whole stack: the QMS that runs the bakery, and the process-mining
# service that analyses what it produced.
#
# They stay two separate processes on purpose. QMS owns the business data and
# must not go down because a discovery job on a large log ate the CPU; the
# analytics service is stateless enough to restart at any time. What is merged
# is the repository and the lifecycle - one clone, one `docker compose up`.
#
#   docker compose up -d --build
#
# QMS            -> http://localhost:8000
# Process mining -> http://localhost:8001

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-qms}
      POSTGRES_USER: ${DB_USER:-qms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qms_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qms:
    build: ./services/qms
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ""
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-qms}
      DB_USER: ${DB_USER:-qms}
      DB_PASSWORD: ${DB_PASSWORD:-qms_password}
      PORT: 8000
      # Wired to the sibling service by container name - no IPs, no ports on
      # the host, and it keeps working if you move the stack to another machine.
      PROCESS_MINING_EVENT_LOG_URL: http://process-mining:8000/api/event-logs/import/
      PROCESS_MINING_API_URL: http://process-mining:8000/api/transcriptions/
      PROCESS_MINING_API_TOKEN: ${PM_API_KEYS:?set PM_API_KEYS in .env}
      PROCESS_MINING_SOURCE: ${PROCESS_MINING_SOURCE:-kms_bakery}
      # Must be absolute: the analytics service POSTs the transcript here, and
      # it has no way to resolve a path relative to the QMS.
      PROCESS_MINING_CALLBACK_URL: http://qms:8000/api/process-mining/callback/
      PROCESS_MINING_CALLBACK_SECRET: ${PM_CALLBACK_SECRET:?set PM_CALLBACK_SECRET in .env}
    # Bound to the loopback by default. The app speaks plain http here, and the
    # only thing that should reach it is the TLS proxy in front - or the
    # Tailscale daemon on the host when the stack is published to the internet.
    # BIND_ADDR=0.0.0.0 puts it back on the network for LAN debugging.
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${QMS_PORT:-8000}:8000"
    volumes:
      - qms_static:/app/staticfiles
      - qms_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      process-mining:
        condition: service_started

  process-mining:
    build: ./services/process-mining
    restart: unless-stopped
    environment:
      PM_ENVIRONMENT: ${PM_ENVIRONMENT:-prod}
      PM_DEBUG: "false"
      PM_API_KEYS: ${PM_API_KEYS:?set PM_API_KEYS in .env}
      PM_CORS_ORIGINS: ${PM_CORS_ORIGINS:-*}
      PM_STORAGE_BACKEND: sqlite
      PM_SQLITE_PATH: /srv/data/pm.db
      PM_ARTIFACT_DIR: /srv/data/artifacts
      PM_STT_URL: http://stt:8080
      PM_STT_LANGUAGE: ${PM_STT_LANGUAGE:-ru}
      # Read by the 1C connector (app/connectors/onec.py), which runs on demand
      # rather than as part of the service.
      ONEC_URL: ${ONEC_URL:-}
      ONEC_USER: ${ONEC_USER:-}
      ONEC_PASSWORD: ${ONEC_PASSWORD:-}
      PM_CALLBACK_SECRET: ${PM_CALLBACK_SECRET:?set PM_CALLBACK_SECRET in .env}
      # Discovery is CPU-bound and shares 4 cores with Postgres, Django and the
      # speech model. Two keeps a heavy job from starving the rest.
      PM_MAX_CONCURRENT_JOBS: ${PM_MAX_CONCURRENT_JOBS:-2}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PM_PORT:-8001}:8000"
    volumes:
      - pm_data:/srv/data
      - ./services/process-mining/config:/srv/config:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  # The Android app's backend. It holds the phone's connection open while the
  # recording is transcribed, then hands the text to the QMS as a command
  # nobody has confirmed yet - the same place the browser's voice widget
  # arrives at, so a spoken command behaves identically whichever it came from.
  #
  # It carries no model of its own: PTT_TRANSCRIBE_URL points at the analytics
  # service, which owns the speech container. Two Whispers in one stack meant
  # two sets of weights in RAM and two answers to the same recording.
  pushtotalk:
    build: ./services/pushtotalk/backend
    restart: unless-stopped
    environment:
      PTT_RUNTIME_DIR: /srv/ptt
      PTT_TRANSCRIBE_URL: http://process-mining:8000/api/transcriptions/sync
      PTT_TRANSCRIBE_TOKEN: ${PM_API_KEYS:?set PM_API_KEYS in .env}
      # Absolute, by container name: this is a server-to-server call and the
      # phone never learns the QMS token.
      PTT_KMS_COMMAND_URL: http://qms:8000/api/pushtotalk/commands/
      PTT_KMS_API_TOKEN: ${PUSHTOTALK_API_TOKEN:?set PUSHTOTALK_API_TOKEN in .env}
      PTT_LOG_LEVEL: ${PTT_LOG_LEVEL:-INFO}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PTT_PORT:-8002}:8000"
    volumes:
      - ptt_data:/srv/ptt
    depends_on:
      process-mining:
        condition: service_started

  # Reusable voice command gateway. OVOS publishes recognized text to MQTT,
  # this service turns the message into project-specific API calls. Today it
  # routes to QMS, later the same gateway can route to another project adapter.
  voice-gateway:
    build: ./services/voice-gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      VOICE_GATEWAY_PROJECT: ${VOICE_GATEWAY_PROJECT:-kms}
      VOICE_GATEWAY_KMS_COMMAND_URL: http://qms:8000/api/pushtotalk/commands/
      VOICE_GATEWAY_KMS_API_TOKEN: ${PUSHTOTALK_API_TOKEN:?set PUSHTOTALK_API_TOKEN in .env}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${VOICE_GATEWAY_PORT:-8010}:8000"
    depends_on:
      qms:
        condition: service_started

  # Speech-to-text. Separate container on purpose: the model is the heaviest
  # thing in the stack, and this way it can be swapped, given a GPU or moved to
  # another host without touching anything else.
  stt:
    # `alpha` is the only tag this image publishes - there is no `latest`.
    image: smartgic/ovos-stt-server-fasterwhisper:${STT_IMAGE_TAG:-alpha}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      # The model is chosen in this file, not by environment variables: the
      # image reads it as OVOS config. A user config outranks the one baked
      # into the image, which asks for medium on 4 threads.
      - ./services/stt/mycroft.conf:/home/ovos/.config/mycroft/mycroft.conf:ro
      # Keeps downloaded weights across restarts - otherwise every recreate
      # re-downloads the model.
      - stt_models:/home/ovos/.cache
    deploy:
      resources:
        limits:
          cpus: "${STT_CPUS:-2}"

  # TLS in front of both apps. Not for secrecy on a LAN - browsers simply
  # refuse microphone access outside a secure context, so voice commands are
  # impossible over plain http from anything but localhost.
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${PM_HTTPS_PORT:-8443}:8443"
      # 10000 rather than any other free number: Tailscale Funnel publishes
      # exactly 443, 8443 and 10000, and the phone needs a public https
      # address for its microphone the same way the browser does.
      - "${PTT_HTTPS_PORT:-10000}:10000"
    volumes:
      - ./services/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./services/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - qms
      - process-mining
      - pushtotalk

volumes:
  postgres_data:
  qms_static:
  qms_media:
  pm_data:
  ptt_data:
  stt_models:
