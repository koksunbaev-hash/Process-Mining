# The whole stack: the QMS that runs the bakery, and the process-mining
# service that analyses what it produced.
#
# They stay two separate processes on purpose. QMS owns the business data and
# must not go down because a discovery job on a large log ate the CPU; the
# analytics service is stateless enough to restart at any time. What is merged
# is the repository and the lifecycle - one clone, one `docker compose up`.
#
#   docker compose up -d --build
#
# QMS            -> http://localhost:8000
# Process mining -> http://localhost:8001

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-qms}
      POSTGRES_USER: ${DB_USER:-qms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qms_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  qms:
    build: ./services/qms
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ""
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-qms}
      DB_USER: ${DB_USER:-qms}
      DB_PASSWORD: ${DB_PASSWORD:-qms_password}
      PORT: 8000
      # Wired to the sibling service by container name - no IPs, no ports on
      # the host, and it keeps working if you move the stack to another machine.
      PROCESS_MINING_EVENT_LOG_URL: http://process-mining:8000/api/event-logs/import/
      PROCESS_MINING_API_URL: http://process-mining:8000/api/transcriptions/
      PROCESS_MINING_API_TOKEN: ${PM_API_KEYS:?set PM_API_KEYS in .env}
      PROCESS_MINING_SOURCE: ${PROCESS_MINING_SOURCE:-kms_bakery}
      # Must be absolute: the analytics service POSTs the transcript here, and
      # it has no way to resolve a path relative to the QMS.
      PROCESS_MINING_CALLBACK_URL: http://qms:8000/api/process-mining/callback/
      PROCESS_MINING_CALLBACK_SECRET: ${PM_CALLBACK_SECRET:?set PM_CALLBACK_SECRET in .env}
    ports:
      - "${QMS_PORT:-8000}:8000"
    volumes:
      - qms_static:/app/staticfiles
      - qms_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      process-mining:
        condition: service_started

  process-mining:
    build: ./services/process-mining
    restart: unless-stopped
    environment:
      PM_ENVIRONMENT: ${PM_ENVIRONMENT:-prod}
      PM_DEBUG: "false"
      PM_API_KEYS: ${PM_API_KEYS:?set PM_API_KEYS in .env}
      PM_CORS_ORIGINS: ${PM_CORS_ORIGINS:-*}
      PM_STORAGE_BACKEND: sqlite
      PM_SQLITE_PATH: /srv/data/pm.db
      PM_ARTIFACT_DIR: /srv/data/artifacts
      PM_STT_URL: http://stt:8080
      PM_STT_LANGUAGE: ${PM_STT_LANGUAGE:-ru}
      PM_CALLBACK_SECRET: ${PM_CALLBACK_SECRET:?set PM_CALLBACK_SECRET in .env}
      # Discovery is CPU-bound and shares 4 cores with Postgres, Django and the
      # speech model. Two keeps a heavy job from starving the rest.
      PM_MAX_CONCURRENT_JOBS: ${PM_MAX_CONCURRENT_JOBS:-2}
    ports:
      - "${PM_PORT:-8001}:8000"
    volumes:
      - pm_data:/srv/data
      - ./services/process-mining/config:/srv/config:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Speech-to-text. Separate container on purpose: the model is the heaviest
  # thing in the stack, and this way it can be swapped, given a GPU or moved to
  # another host without touching anything else.
  stt:
    image: smartgic/ovos-stt-plugin-fasterwhisper:${STT_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # `small` is the sweet spot for Russian on a CPU: `base` mishears batch
      # numbers, `medium` does not fit the latency budget without a GPU.
      MODEL: ${STT_MODEL:-small}
      COMPUTE_TYPE: ${STT_COMPUTE_TYPE:-int8}
      OMP_NUM_THREADS: ${STT_THREADS:-2}
    volumes:
      # Keeps the downloaded weights across rebuilds - otherwise every
      # `up --build` re-downloads half a gigabyte.
      - stt_models:/home/ovos/.cache/huggingface
    deploy:
      resources:
        limits:
          cpus: "${STT_CPUS:-2}"

volumes:
  postgres_data:
  qms_static:
  qms_media:
  pm_data:
  stt_models:
