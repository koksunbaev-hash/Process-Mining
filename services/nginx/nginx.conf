# TLS termination for the stack.
#
# The point is not secrecy on a factory LAN - it is that browsers refuse
# microphone access outside a "secure context". Plain http://<ip> disables
# getUserMedia entirely, so voice commands only ever worked on localhost.
# With TLS they work from any machine on the network.
#
#   https://<host>/       -> QMS (kanban, orders, voice)
#   https://<host>:8443/  -> process mining console
#
# Separate ports rather than one host with path prefixes: both apps serve
# absolute asset paths (/static/..., /ui/...), and rewriting those on the fly
# is a reliable way to break them.

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  # Uploads: audio recordings and event-log CSV batches.
  client_max_body_size 128m;

  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ---- who the client actually is -----------------------------------------
  # Published to the internet through Tailscale Funnel, every request arrives
  # from the local tailscaled and reaches this container as the docker gateway.
  # Rate limiting by $remote_addr would then treat the whole internet as one
  # client. Trust the forwarded chain from the gateway only - a machine on the
  # LAN connects directly and keeps its own address, so it cannot forge one.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from 172.16.0.0/12;
  real_ip_header    X-Forwarded-For;
  real_ip_recursive on;

  # ---- rate limits --------------------------------------------------------
  # There is no rate limiting inside either application. These zones are the
  # only thing between a public address and an unattended password guesser.
  limit_req_zone  $binary_remote_addr zone=web:10m   rate=30r/s;
  limit_req_zone  $binary_remote_addr zone=login:10m rate=12r/m;
  limit_req_zone  $binary_remote_addr zone=api:10m   rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=conn:10m;
  limit_req_status  429;
  limit_conn_status 429;

  # ---- redirect plain http ------------------------------------------------
  server {
    listen 80 default_server;
    return 301 https://$host$request_uri;
  }

  # ---- QMS ----------------------------------------------------------------
  server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # Inherited by every location below, so a new location cannot forget them.
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # Django reads this to know the original scheme was https; without it
    # CSRF rejects every form posted over TLS.
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    proxy_connect_timeout 10s;
    proxy_send_timeout    120s;
    proxy_read_timeout    120s;

    limit_conn conn 40;

    # The two doors worth guarding. 12 attempts a minute is invisible to a
    # person typing a password and useless to anything working through a list.
    location = /login/ {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://qms:8000;
    }

    location /admin/ {
      limit_req zone=login burst=10 nodelay;
      proxy_pass http://qms:8000;
    }

    location / {
      limit_req zone=web burst=60 nodelay;
      proxy_pass http://qms:8000;
    }
  }

  # ---- process mining console --------------------------------------------
  server {
    listen 8443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # FastAPI sends no security headers of its own.
    add_header X-Content-Type-Options nosniff  always;
    add_header X-Frame-Options        DENY     always;
    add_header Referrer-Policy        same-origin always;

    location / {
      # Every endpoint here needs an API key, so this only has to blunt a
      # scanner hammering the door: discovery is CPU-bound and two concurrent
      # jobs is the whole budget.
      limit_req  zone=api burst=20 nodelay;
      limit_conn conn 20;

      proxy_pass http://process-mining:8000;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      # Discovery on a large log is CPU-bound and slow; the default 60s would
      # cut off a job that was about to succeed.
      proxy_connect_timeout 10s;
      proxy_send_timeout    600s;
      proxy_read_timeout    600s;
      proxy_buffering off;
    }
  }
}
