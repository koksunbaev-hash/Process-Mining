# TLS termination for the stack.
#
# The point is not secrecy on a factory LAN - it is that browsers refuse
# microphone access outside a "secure context". Plain http://<ip> disables
# getUserMedia entirely, so voice commands only ever worked on localhost.
# With TLS they work from any machine on the network.
#
#   https://<host>/       -> QMS (kanban, orders, voice)
#   https://<host>:8443/  -> process mining console
#
# Separate ports rather than one host with path prefixes: both apps serve
# absolute asset paths (/static/..., /ui/...), and rewriting those on the fly
# is a reliable way to break them.

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  server_tokens off;

  # Uploads: audio recordings and event-log CSV batches.
  client_max_body_size 128m;

  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_ciphers         HIGH:!aNULL:!MD5;
  ssl_session_cache   shared:SSL:10m;
  ssl_session_timeout 10m;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # ---- redirect plain http ------------------------------------------------
  server {
    listen 80 default_server;
    return 301 https://$host$request_uri;
  }

  # ---- QMS ----------------------------------------------------------------
  server {
    listen 443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location / {
      proxy_pass http://qms:8000;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      # Django reads this to know the original scheme was https; without it
      # CSRF rejects every form posted over TLS.
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        $connection_upgrade;

      proxy_connect_timeout 10s;
      proxy_send_timeout    120s;
      proxy_read_timeout    120s;
    }
  }

  # ---- process mining console --------------------------------------------
  server {
    listen 8443 ssl;
    http2 on;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    location / {
      proxy_pass http://process-mining:8000;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;

      # Discovery on a large log is CPU-bound and slow; the default 60s would
      # cut off a job that was about to succeed.
      proxy_connect_timeout 10s;
      proxy_send_timeout    600s;
      proxy_read_timeout    600s;
      proxy_buffering off;
    }
  }
}
