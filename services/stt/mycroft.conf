{
  "_comment": [
    "Overrides the config baked into the image, which asks for whisper-medium",
    "on 4 threads - too slow for this host and greedy enough to starve the QMS.",
    "",
    "model:       tiny | base | small | medium | large-v2 | large-v3",
    "             No 'whisper-' prefix - the plugin asserts on the bare name,",
    "             and the value baked into the image ('whisper-medium') fails",
    "             that assertion. small is the starting point for Russian.",
    "",
    "             Measured on this host - 2 cores, no GPU, int8, 5s of audio,",
    "             model already loaded:",
    "               base      0.75s   141MB   mangles digits, not for batch ids",
    "               small     1.57s   464MB   was the default",
    "               medium    4.60s   1.4GB   <- here now",
    "               large-v3  6.40s   2.9GB   most accurate, 40% slower",
    "               large-v2  6.60s   2.9GB   no reason over v3: same speed, worse",
    "             Timings come from a tone rather than speech, so real commands",
    "             run longer; the ratios between models are the usable part. The",
    "             ceiling that matters is the analytics service giving up at 120s",
    "             (stt_timeout_seconds), and every model here clears it easily.",
    "             medium is the compromise: three times small's cost for markedly",
    "             better digits, which is all these commands are made of.",
    "             Changing it: edit here, then docker compose restart stt.",
    "beam_size:   5 keeps batch numbers right, which is what the commands are",
    "             made of. 1 is greedy decoding and roughly twice as fast, but",
    "             it guessed digits wrong often enough to be not worth it.",
    "cpu_threads: 2 of the 4 cores, so a transcription cannot freeze Django."
  ],
  "stt": {
    "module": "ovos-stt-plugin-fasterwhisper",
    "ovos-stt-plugin-fasterwhisper": {
      "model": "large-v3",
      "beam_size": 5,
      "cpu_threads": 2,
      "compute_type": "int8"
    }
  },
  "lang": "kk-kz"
}
