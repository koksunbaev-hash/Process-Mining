{
  "_comment": [
    "Overrides the config baked into the image, which asks for whisper-medium",
    "on 4 threads - too slow for this host and greedy enough to starve the QMS.",
    "",
    "model:       tiny | base | small | medium | large-v2 | large-v3",
    "             No 'whisper-' prefix - the plugin asserts on the bare name,",
    "             and the value baked into the image ('whisper-medium') fails",
    "             that assertion. small is the starting point for Russian.",
    "beam_size:   5 keeps batch numbers right, which is what the commands are",
    "             made of. 1 is greedy decoding and roughly twice as fast, but",
    "             it guessed digits wrong often enough to be not worth it.",
    "cpu_threads: 2 of the 4 cores, so a transcription cannot freeze Django."
  ],
  "stt": {
    "module": "ovos-stt-plugin-fasterwhisper",
    "ovos-stt-plugin-fasterwhisper": {
      "model": "small",
      "beam_size": 5,
      "cpu_threads": 2,
      "compute_type": "int8"
    }
  },
  "lang": "ru-ru"
}
