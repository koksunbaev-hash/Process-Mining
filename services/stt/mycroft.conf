{
  "_comment": [
    "Overrides the config baked into the image, which asks for whisper-medium",
    "on 4 threads - too slow for this host and greedy enough to starve the QMS.",
    "",
    "model:       whisper-tiny | whisper-base | whisper-small | whisper-medium",
    "             small is the starting point for Russian on a CPU.",
    "beam_size:   1 is greedy decoding - roughly twice as fast as 5 and good",
    "             enough for short fixed-vocabulary commands. Raise it if the",
    "             recogniser starts guessing wrong on batch numbers.",
    "cpu_threads: 2 of the 4 cores, so a transcription cannot freeze Django."
  ],
  "stt": {
    "module": "ovos-stt-plugin-fasterwhisper",
    "ovos-stt-plugin-fasterwhisper": {
      "model": "whisper-small",
      "beam_size": 1,
      "cpu_threads": 2,
      "compute_type": "int8"
    }
  },
  "lang": "ru-ru"
}
