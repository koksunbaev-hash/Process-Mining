# Reverse proxy for the Process Mining Service.
# Long timeouts on purpose: discovery on a large log is CPU-bound and slow.

upstream process_mining {
    server process-mining:8000;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name pm.example.com;

    ssl_certificate     /etc/ssl/certs/pm.crt;
    ssl_certificate_key /etc/ssl/private/pm.key;

    client_max_body_size 128m;

    location / {
        proxy_pass http://process_mining;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout    600s;
        proxy_read_timeout    600s;
        proxy_buffering off;
    }

    location /health/ {
        proxy_pass http://process_mining;
        access_log off;
    }
}
