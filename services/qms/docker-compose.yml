services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-qms}
      POSTGRES_USER: ${DB_USER:-qms}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qms_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ""
      DB_ENGINE: postgresql
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-qms}
      DB_USER: ${DB_USER:-qms}
      DB_PASSWORD: ${DB_PASSWORD:-qms_password}
      PORT: 8000
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - staticfiles:/app/staticfiles
      - media:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  staticfiles:
  media:
