<div class="voice-widget" data-voice-widget data-voice-mode="idle">
  <section class="voice-widget__panel" data-voice-panel hidden>
    <header class="voice-widget__header">
      <strong data-voice-state>Готов к записи</strong>
      <button type="button" class="voice-widget__close" data-voice-close aria-label="Закрыть">×</button>
    </header>
    <div class="voice-widget__body">

      <div class="voice-widget__live" data-voice-live hidden>
        <div class="voice-widget__meter" aria-hidden="true"><i data-voice-level></i></div>
        <div class="voice-widget__timer" data-voice-timer>0.0 с</div>
      </div>

      <p class="voice-widget__hint" data-voice-hint>
        Держите кнопку микрофона или клавишу <kbd>Пробел</kbd> и говорите.
        Отпустите — команда уйдёт на распознавание.
      </p>

      <div class="voice-widget__result" data-voice-result hidden>
        <div class="voice-widget__text" data-voice-transcript></div>
        <dl>
          <div><dt>Партия</dt><dd data-voice-batch>-</dd></div>
          <div><dt>Текущий этап</dt><dd data-voice-current>-</dd></div>
          <div><dt>Следующий этап</dt><dd data-voice-next>-</dd></div>
          <div data-voice-unit-row hidden><dt>Устройство</dt><dd data-voice-unit>-</dd></div>
          <div><dt>Комментарий</dt><dd data-voice-comment>-</dd></div>
          <div><dt>Уверенность</dt><dd data-voice-confidence>-</dd></div>
        </dl>
        <p class="voice-widget__warning" data-voice-warning hidden>Низкая уверенность распознавания. Проверьте команду вручную.</p>
        <div class="voice-widget__actions">
          <button type="button" class="btn secondary" data-voice-reject>Отмена</button>
          <button type="button" class="btn primary voice-widget__go" data-voice-confirm>
            <span class="voice-widget__ringwrap" data-voice-ring hidden>
              <svg viewBox="0 0 48 48" aria-hidden="true">
                <circle class="voice-widget__ring-track" cx="24" cy="24" r="21"></circle>
                <circle class="voice-widget__ring-fill" cx="24" cy="24" r="21" data-voice-ring-fill></circle>
              </svg>
              <b data-voice-ring-count>3</b>
            </span>
            <span data-voice-confirm-label>Подтвердить</span>
          </button>
        </div>
      </div>

      <p class="voice-widget__message" data-voice-message></p>
    </div>
  </section>

  <button class="voice-widget__fab" type="button" data-voice-ptt
          aria-label="Удерживайте для записи голосовой команды">
    <span class="voice-widget__fab-icon" aria-hidden="true">🎙</span>
    <span class="voice-widget__ring" aria-hidden="true"></span>
  </button>
</div>
